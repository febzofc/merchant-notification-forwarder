name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis yang dibuat, contoh: v1.1"
        required: true
        type: string

permissions:
  contents: write

env:
  ANDROID_PLATFORM: "platforms;android-36.1"
  ANDROID_BUILD_TOOLS: "build-tools;36.1.0"

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tentukan versi rilis
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "${{ env.ANDROID_PLATFORM }} ${{ env.ANDROID_BUILD_TOOLS }} platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # APK wajib ditandatangani dengan keystore rilis yang tetap (bukan debug
      # keystore). Jika signer berubah tiap rilis, pengguna tidak bisa melakukan
      # update (muncul "App not installed") dan Play Protect menandai APK.
      - name: Siapkan keystore rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diset. Tambahkan KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD, dan KEY_ALIAS di Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          test -s upload-keystore.jks

      - name: Build APK release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verifikasi APK
        id: verify
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

          # Build release tidak boleh mengandung android:debuggable
          if "$BUILD_TOOLS/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q debuggable; then
            echo "::error::APK masih mengandung android:debuggable=true"
            exit 1
          fi

          FINGERPRINT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -n 1 | sed 's/.*digest: //')
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          {
            echo "### APK release tertandatangani"
            echo ""
            echo "- Berkas: \`$APK\`"
            echo "- Signer SHA-256: \`$FINGERPRINT\`"
            echo "- Ukuran: $(du -h "$APK" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Siapkan berkas APK
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          NAME="Bayarin-${{ steps.version.outputs.value }}.apk"
          mkdir -p dist
          cp "$SRC" "dist/$NAME"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Siapkan berkas AAB (Play Console)
        id: aab
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          NAME="Bayarin-${{ steps.version.outputs.value }}.aab"
          mkdir -p dist
          cp "$SRC" "dist/$NAME"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          jarsigner -verify "$SRC" >/dev/null
          ls -la dist

      - name: Hapus keystore
        if: always()
        run: rm -f upload-keystore.jks

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bayarin-${{ steps.version.outputs.value }}-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Simpan AAB sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bayarin-${{ steps.version.outputs.value }}-aab
          path: ${{ steps.aab.outputs.path }}

      - name: Publikasikan GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: ${{ steps.version.outputs.value }}
          body: |
            APK ditandatangani dengan kunci rilis tetap.

            **Signer SHA-256:** `${{ steps.verify.outputs.fingerprint }}`

            Jika sebelumnya pernah memasang versi debug (v1.0), uninstall dulu
            karena kunci penandatanganannya berbeda.
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.aab.outputs.path }}
          fail_on_unmatched_files: true
